services:
  octopus-games:
    build:
      context: .
      args:
        # Same GitHub Packages token the other auth-client consumers use.
        # A stack variable reaches the BUILD only if it is named here.
        NPM_TOKEN: ${NPM_TOKEN}
    container_name: octopus-games
    restart: unless-stopped
    ports:
      - "3013:3013"
    environment:
      - PORT=3013
      - NODE_ENV=production
      - SESSION_SECRET=${SESSION_SECRET}
      - CORTEX_URL=http://octopus-cortex:3010
      - AUTH_SERVICE_URL=http://octopus-auth:3002
      # Must match cortex's INTERNAL_SECRET exactly, or cortex's
      # /api/internal/game-servers returns 403 and the games site shows
      # "No public servers" (games turns the 403 into a 502). Portainer only
      # passes a var the container can see if there's a line for it here.
      - INTERNAL_SECRET=${INTERNAL_SECRET:-}
    volumes:
      - games_data:/app/data
    networks:
      - octopus_network

volumes:
  games_data:

networks:
  octopus_network:
    external: true
